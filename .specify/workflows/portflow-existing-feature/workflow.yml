schema_version: "1.0"

workflow:
  id: "portflow-existing-feature"
  name: "Portflow Existing Spec Delivery"
  version: "2.0.0"
  author: "Portflow"
  description: "Phase contract used by the issue-driven terminal orchestrator for existing specs"

requires:
  speckit_version: ">=0.14.2"
  integrations:
    any: ["codex"]

inputs:
  spec:
    type: string
    required: true
    prompt: "Low-level compatibility input; daily operation uses pnpm spec:workflow with a GitHub issue"

steps:
  - id: clarify
    type: shell
    timeout: 3600
    run: "node scripts/spec-kit/interactive-clarify.mjs"

  - id: preview-clarified-spec-commit
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate spec --preview"

  - id: review-clarified-spec-commit
    type: gate
    message: "Confirm this commit message: {{ steps.preview-clarified-spec-commit.output.stdout }}"
    options: [approve, reject]
    on_reject: abort

  - id: sync-clarified-spec-pr
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate spec"

  - id: review-spec
    type: gate
    message: "Review the updated spec.md and resolve every product decision before planning."
    options: [approve, reject]
    on_reject: retry

  - id: plan
    command: speckit.plan
    integration: codex
    input:
      args: "{{ inputs.spec }}\n\nHuman feedback (if provided): {{ inputs.feedback }}"

  - id: preview-plan-commit
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate plan --preview"

  - id: review-plan-commit
    type: gate
    message: "Confirm this commit message: {{ steps.preview-plan-commit.output.stdout }}"
    options: [approve, reject]
    on_reject: abort

  - id: sync-plan-pr
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate plan"

  - id: checklist
    command: speckit.checklist
    integration: codex
    input:
      args: "{{ inputs.spec }}\n\nHuman feedback (if provided): {{ inputs.feedback }}"

  - id: preview-checklist-commit
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate plan --preview"

  - id: review-checklist-commit
    type: gate
    message: "Confirm this commit message: {{ steps.preview-checklist-commit.output.stdout }}"
    options: [approve, reject]
    on_reject: abort

  - id: sync-checklist-pr
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate plan"

  - id: review-plan
    type: gate
    message: "Review plan.md and checklist before implementation tasks are generated."
    options: [approve, reject]
    on_reject: retry

  - id: tasks
    command: speckit.tasks
    integration: codex
    input:
      args: "{{ inputs.spec }}\n\nHuman feedback (if provided): {{ inputs.feedback }}"

  - id: preview-tasks-commit
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate plan --preview"

  - id: review-tasks-commit
    type: gate
    message: "Confirm this commit message: {{ steps.preview-tasks-commit.output.stdout }}"
    options: [approve, reject]
    on_reject: abort

  - id: sync-tasks-pr
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate plan"

  - id: analyze
    command: speckit.analyze
    integration: codex
    input:
      args: "{{ inputs.spec }}\n\nHuman feedback (if provided): {{ inputs.feedback }}"

  - id: preview-analysis-commit
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate plan --preview"

  - id: review-analysis-commit
    type: gate
    message: "Confirm this commit message: {{ steps.preview-analysis-commit.output.stdout }}"
    options: [approve, reject]
    on_reject: abort

  - id: sync-analysis-pr
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate plan"

  - id: implement
    command: speckit.implement
    integration: codex
    input:
      args: "{{ inputs.spec }}\n\nHuman feedback (if provided): {{ inputs.feedback }}"

  - id: preview-implementation-commit
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate delivery --preview"

  - id: review-implementation-commit
    type: gate
    message: "Confirm this commit message: {{ steps.preview-implementation-commit.output.stdout }}"
    options: [approve, reject]
    on_reject: abort

  - id: sync-implementation-pr
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate delivery"

  - id: fast-checks
    type: shell
    run: "pnpm check && pnpm typecheck && pnpm test && pnpm test:spec-kit"

  - id: preview-checks-commit
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate delivery --preview"

  - id: review-checks-commit
    type: gate
    message: "Confirm this commit message: {{ steps.preview-checks-commit.output.stdout }}"
    options: [approve, reject]
    on_reject: abort

  - id: sync-checks-pr
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate delivery"

  - id: converge
    command: speckit.converge
    integration: codex
    input:
      args: "{{ inputs.spec }}\n\nHuman feedback (if provided): {{ inputs.feedback }}"

  - id: preview-convergence-commit
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate delivery --preview"

  - id: review-convergence-commit
    type: gate
    message: "Confirm this commit message: {{ steps.preview-convergence-commit.output.stdout }}"
    options: [approve, reject]
    on_reject: abort

  - id: sync-convergence-pr
    type: shell
    run: "node scripts/spec-kit/pr-sync.mjs --feature-dir \"$SPECIFY_FEATURE_DIRECTORY\" --gate delivery"

  - id: final-review
    type: gate
    message: "Review the implementation, checks, convergence report, and Draft PR before marking it ready."
    options: [approve, reject]
    on_reject: retry
