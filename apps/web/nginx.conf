server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The path of an activation link *is* its secret (`/activate/<secret>`): it must reach no access
    # log, and no request the page makes may carry it in a `Referer`.
    #
    # `/index.html` is a file to try, not the fallback URI: a fallback is an internal redirect, which
    # would finish the request in `location /` — logged, and without the header.
    location ^~ /activate/ {
        access_log off;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
