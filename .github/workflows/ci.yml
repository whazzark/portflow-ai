name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      PORT: 3333
      HOST: 0.0.0.0
      LOG_LEVEL: info
      APP_KEY: ci-only-insecure-app-key-0123456789
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: portflow
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format & lint
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  pr-template-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body follows the template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0

          if ! grep -qiE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]+#[0-9]+' <<< "$PR_BODY"; then
            echo "::error::PR body must reference the issue it closes, e.g. 'Closes #12'."
            fail=1
          fi

          summary=$(awk '/^## Summary/{f=1; next} /^## /{f=0} f' <<< "$PR_BODY" | sed 's/<!--.*-->//g' | tr -d '[:space:]')
          if [ -z "$summary" ]; then
            echo "::error::## Summary section must not be empty."
            fail=1
          fi

          db_section=$(awk '/^## Database/{f=1; next} /^## /{f=0} f' <<< "$PR_BODY")
          db_checked=$(grep -ciE '^[[:space:]]*-[[:space:]]*\[[xX]\]' <<< "$db_section" || true)
          if [ "${db_checked:-0}" -ne 1 ]; then
            echo "::error::## Database section must have exactly one box checked ('No migration' or 'Migration included and reversible')."
            fail=1
          fi

          checklist_section=$(awk '/^## Checklist/{f=1; next} /^## /{f=0} f' <<< "$PR_BODY")
          unchecked=$(grep -c '^[[:space:]]*-[[:space:]]*\[ \]' <<< "$checklist_section" || true)
          if [ "${unchecked:-0}" -ne 0 ]; then
            echo "::error::All items in ## Checklist must be checked before merging."
            fail=1
          fi

          exit $fail
