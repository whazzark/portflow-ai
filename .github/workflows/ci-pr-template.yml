name: PR Contract Check

on:
  pull_request:

jobs:
  pr-contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test Spec Kit guardrails
        run: node --test scripts/spec-kit/*.test.mjs

      - name: Validate progressive PR contract
        run: node scripts/spec-kit/validate-pr.mjs
