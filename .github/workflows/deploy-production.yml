name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/portflow-ai-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/portflow-ai-web

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve image tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || 'manual' }}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          TZ: UTC
          PORT: 3333
          HOST: 0.0.0.0
          LOG_LEVEL: info
          APP_KEY: ci-only-insecure-app-key-0123456789
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: portflow

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.API_BASE_URL }}
          tags: ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.tag }}
