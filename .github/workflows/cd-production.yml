name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/portflow-ai-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/portflow-ai-web

jobs:
  verify:
    uses: ./.github/workflows/ci-checks.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve image tag
        id: tag
        run: echo "tag=${{ github.event.release.tag_name || 'manual' }}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.API_BASE_URL }}
            VITE_MAP_STYLE_LIGHT_URL=${{ vars.MAP_STYLE_LIGHT_URL || 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json' }}
            VITE_MAP_STYLE_DARK_URL=${{ vars.MAP_STYLE_DARK_URL || 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json' }}
          tags: ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.tag }}
